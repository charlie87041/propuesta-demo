<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Infra'">Infra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: "#16211f",
                        field: "#f7f9f7",
                        accent: "#176b57",
                        line: "#d7dfd8"
                    }
                }
            }
        };
    </script>
</th:block>
<body>
<aside th:fragment="sidebar(active)" class="fixed inset-y-0 left-0 z-20 hidden w-72 border-r border-line bg-white lg:block">
    <div class="flex h-full flex-col">
        <div class="border-b border-line px-5 py-4">
            <a href="/dashboard" class="flex items-center gap-3 text-ink">
                <span class="flex h-9 w-9 items-center justify-center rounded bg-accent text-sm font-bold text-white">IF</span>
                <span>
                    <span class="block text-sm font-semibold leading-4" th:text="#{app.name}">Infra</span>
                    <span class="block text-xs text-slate-500" th:text="#{app.subtitle}">Control Plane</span>
                </span>
            </a>
        </div>

        <nav class="flex-1 overflow-y-auto px-3 py-4 text-sm">
            <a href="/dashboard"
               th:classappend="${active == 'dashboard'} ? 'bg-field text-ink' : 'text-slate-600 hover:bg-field hover:text-ink'"
               class="mb-2 block rounded px-3 py-2 font-medium"
               th:text="#{nav.dashboard}">
                Dashboard
            </a>

            <div class="mt-3">
                <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{nav.section.catalog}">Catalog</p>
                <div class="space-y-1 pl-4">
                    <a href="/projects"
                       th:classappend="${active == 'projects'} ? 'bg-field text-ink' : 'text-slate-600 hover:bg-field hover:text-ink'"
                       class="block rounded px-3 py-2 font-medium"
                       th:text="#{nav.projects}">
                        Projects
                    </a>
                    <a href="/applications"
                       th:classappend="${active == 'applications'} ? 'bg-field text-ink' : 'text-slate-600 hover:bg-field hover:text-ink'"
                       class="block rounded px-3 py-2 font-medium"
                       th:text="#{nav.applications}">
                        Applications
                    </a>
                </div>
            </div>

            <div class="mt-3">
                <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-500" th:text="#{nav.section.topology}">Topology</p>
                <div class="space-y-1 pl-4">
                    <a href="/project-environments"
                       th:classappend="${active == 'project-environments'} ? 'bg-field text-ink' : 'text-slate-600 hover:bg-field hover:text-ink'"
                       class="block rounded px-3 py-2 font-medium"
                       th:text="#{nav.environments}">
                        Environments
                    </a>
                    <a href="/resources"
                       th:classappend="${active == 'resources'} ? 'bg-field text-ink' : 'text-slate-600 hover:bg-field hover:text-ink'"
                       class="block rounded px-3 py-2 font-medium"
                       th:text="#{nav.resources}">
                        Resources
                    </a>
                </div>
            </div>
        </nav>

        <div class="border-t border-line p-3 space-y-2">
            <div class="flex justify-center gap-2">
                <a th:href="@{''(lang='en')}" class="rounded border border-line px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-field" th:text="#{nav.lang.en}">EN</a>
                <a th:href="@{''(lang='es')}" class="rounded border border-line px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-field" th:text="#{nav.lang.es}">ES</a>
            </div>
            <form method="post" action="/logout">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="w-full rounded border border-line px-3 py-2 text-sm font-medium text-slate-700 hover:bg-field" th:text="#{nav.logout}">
                    Logout
                </button>
            </form>
        </div>
    </div>
</aside>
</body>
</html>
