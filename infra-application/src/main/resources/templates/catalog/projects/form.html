<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/app-shell :: head(#{projects.form.page-title})}"></th:block>
</head>
<body class="min-h-screen bg-field text-ink">
<aside th:replace="~{fragments/app-shell :: sidebar('projects')}"></aside>
<main class="px-4 py-8 lg:pl-[19rem]">
    <div class="mx-auto max-w-4xl">
    <div class="mb-6">
        <a href="/projects" class="text-sm font-medium text-accent hover:text-emerald-800" th:text="#{action.back.projects}">Back to projects</a>
        <h1 class="mt-3 text-2xl font-semibold tracking-tight" th:text="#{projects.form.title}">New project</h1>
        <p class="mt-1 text-sm text-slate-600" th:text="#{projects.form.subtitle}">Create the local project catalog entry and store provider credentials encrypted.</p>
    </div>

    <form method="post" action="/projects" th:object="${form}" class="rounded border border-line bg-white p-5 shadow-sm">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div th:if="${formError}" class="mb-5 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"
             th:text="${formError}"></div>

        <div class="grid gap-4 md:grid-cols-2">
            <div>
                <label for="key" class="mb-1.5 block text-sm font-medium" th:text="#{field.key}">Key</label>
                <input id="key" th:field="*{key}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                <p th:if="${#fields.hasErrors('key')}" th:errors="*{key}" class="mt-1 text-xs text-rose-600"></p>
            </div>
            <div>
                <label for="name" class="mb-1.5 block text-sm font-medium" th:text="#{field.name}">Name</label>
                <input id="name" th:field="*{name}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-rose-600"></p>
            </div>
            <div>
                <label for="defaultRegion" class="mb-1.5 block text-sm font-medium" th:text="#{field.default-region}">Default region</label>
                <input id="defaultRegion" th:field="*{defaultRegion}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                <p th:if="${#fields.hasErrors('defaultRegion')}" th:errors="*{defaultRegion}" class="mt-1 text-xs text-rose-600"></p>
            </div>
            <div>
                <label for="owner" class="mb-1.5 block text-sm font-medium" th:text="#{field.owner}">Owner</label>
                <input id="owner" th:field="*{owner}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                <p th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}" class="mt-1 text-xs text-rose-600"></p>
            </div>
        </div>

        <div class="mt-4">
            <label for="description" class="mb-1.5 block text-sm font-medium" th:text="#{field.description}">Description</label>
            <textarea id="description" th:field="*{description}" rows="3" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100"></textarea>
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-xs text-rose-600"></p>
        </div>

        <div class="mt-6 border-t border-line pt-5">
            <h2 class="text-base font-semibold" th:text="#{projects.form.section.provider}">Provider</h2>
            <div class="mt-4 grid gap-4 md:grid-cols-2">
                <div>
                    <label for="providerCode" class="mb-1.5 block text-sm font-medium" th:text="#{projects.form.field.cloud-provider}">Cloud provider</label>
                    <select id="providerCode" th:field="*{providerCode}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                        <option th:each="provider : ${providers}" th:value="${provider.code}" th:text="${provider.name}">AWS</option>
                    </select>
                    <p th:if="${#fields.hasErrors('providerCode')}" th:errors="*{providerCode}" class="mt-1 text-xs text-rose-600"></p>
                </div>
            </div>
            <div class="mt-4">
                <label for="providerCredentialsJson" class="mb-1.5 block text-sm font-medium" th:text="#{projects.form.field.credentials}">Credentials JSON</label>
                <textarea id="providerCredentialsJson" th:field="*{providerCredentialsJson}" rows="8" spellcheck="false"
                          class="w-full rounded border border-line bg-slate-950 px-3 py-2 font-mono text-xs text-emerald-100 outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100"></textarea>
                <p th:if="${#fields.hasErrors('providerCredentialsJson')}" th:errors="*{providerCredentialsJson}" class="mt-1 text-xs text-rose-600"></p>
            </div>
        </div>

        <div class="mt-6 flex justify-end gap-3 border-t border-line pt-5">
            <a href="/projects" class="rounded border border-line px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-field" th:text="#{action.cancel}">Cancel</a>
            <button type="submit" class="rounded bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800" th:text="#{projects.form.submit}">Create project</button>
        </div>
    </form>
    </div>
</main>
</body>
</html>
