<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/app-shell :: head(#{project-environments.page-title})}"></th:block>
</head>
<body class="min-h-screen bg-field text-ink">
<aside th:replace="~{fragments/app-shell :: sidebar('project-environments')}"></aside>
<main class="px-4 py-8 lg:pl-[19rem]">
    <div class="mx-auto max-w-7xl">
        <div class="mb-6">
            <h1 class="text-2xl font-semibold tracking-tight" th:text="#{project-environments.title}">Project environments</h1>
            <p class="mt-1 text-sm text-slate-600" th:text="#{project-environments.subtitle}">Choose a project to manage its environments.</p>
        </div>

        <section class="overflow-hidden rounded border border-line bg-white shadow-sm">
            <table class="min-w-full divide-y divide-line text-sm">
                <thead class="bg-field text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-4 py-3" th:text="#{project-environments.col.project}">Project</th>
                    <th class="px-4 py-3" th:text="#{project-environments.col.provider}">Provider</th>
                    <th class="px-4 py-3" th:text="#{project-environments.col.default-region}">Default region</th>
                    <th class="px-4 py-3 text-right" th:text="#{project-environments.col.actions}">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-line">
                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="4" class="px-4 py-10 text-center text-slate-500" th:text="#{project-environments.empty}">No projects yet.</td>
                </tr>
                <tr th:each="project : ${projects}" class="hover:bg-field">
                    <td class="px-4 py-3">
                        <p class="font-medium" th:text="${project.name}">Project</p>
                        <p class="font-mono text-xs text-slate-500" th:text="${project.key}">key</p>
                    </td>
                    <td class="px-4 py-3 uppercase" th:text="${project.providerCode}">aws</td>
                    <td class="px-4 py-3" th:text="${project.defaultRegion}">us-east-1</td>
                    <td class="px-4 py-3 text-right">
                        <a th:href="@{/projects/{id}/environments(id=${project.id})}"
                           class="rounded bg-accent px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-800"
                           th:text="#{project-environments.action.manage}">
                            Manage environments
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
