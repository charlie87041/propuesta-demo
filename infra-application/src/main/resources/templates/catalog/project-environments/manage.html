<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/app-shell :: head(#{project-environments.manage.page-title})}"></th:block>
</head>
<body class="min-h-screen bg-field text-ink">
<aside th:replace="~{fragments/app-shell :: sidebar('projects')}"></aside>
<main class="px-4 py-8 lg:pl-[19rem]">
    <div class="mx-auto max-w-7xl">
        <div class="mb-6">
            <a href="/projects" class="text-sm font-medium text-accent hover:text-emerald-800" th:text="#{action.back.projects}">Back to projects</a>
            <h1 class="mt-3 text-2xl font-semibold tracking-tight" th:text="#{project-environments.manage.title}">Manage environments</h1>
            <p class="mt-1 text-sm text-slate-600">
                <span th:text="${project.name}">Project</span>
                <span class="mx-2 text-slate-300">/</span>
                <span class="font-mono" th:text="${project.key}">key</span>
            </p>
        </div>

        <div th:if="${success}" class="mb-4 rounded border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
             th:text="${success}"></div>
        <div th:if="${error}" class="mb-4 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"
             th:text="${error}"></div>
        <div th:if="${formError}" class="mb-4 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"
             th:text="${formError}"></div>

        <div class="grid gap-5 xl:grid-cols-[1fr_24rem]">
            <section class="overflow-hidden rounded border border-line bg-white shadow-sm">
                <table class="min-w-full divide-y divide-line text-sm">
                    <thead class="bg-field text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                    <tr>
                        <th class="px-4 py-3" th:text="#{project-environments.manage.col.name}">Name</th>
                        <th class="px-4 py-3" th:text="#{project-environments.manage.col.region}">Region</th>
                        <th class="px-4 py-3" th:text="#{project-environments.manage.col.domain}">Domain</th>
                        <th class="px-4 py-3" th:text="#{project-environments.manage.col.status}">Status</th>
                        <th class="px-4 py-3 text-right" th:text="#{project-environments.manage.col.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-line">
                    <tr th:if="${#lists.isEmpty(environments)}">
                        <td colspan="5" class="px-4 py-10 text-center text-slate-500" th:text="#{project-environments.manage.empty}">No environments yet.</td>
                    </tr>
                    <tr th:each="item : ${environments}" class="hover:bg-field">
                        <td class="px-4 py-3 font-medium" th:text="${item.environment.name}">dev</td>
                        <td class="px-4 py-3" th:text="${item.environment.region ?: project.defaultRegion}">us-east-1</td>
                        <td class="px-4 py-3" th:text="${item.environment.domain ?: '-'}">domain</td>
                        <td class="px-4 py-3">
                            <span th:if="${item.active()}" class="rounded bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700" th:text="#{status.active}">ACTIVE</span>
                            <span th:unless="${item.active()}" class="rounded bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-600" th:text="#{status.archived}">ARCHIVED</span>
                        </td>
                        <td class="px-4 py-3">
                            <div th:if="${projectMutable}" class="flex justify-end gap-2">
                                <a th:href="@{/projects/{projectId}/environments/{environmentId}/resources(projectId=${project.id},environmentId=${item.environment.id})}"
                                   class="rounded border border-sky-200 px-3 py-1.5 text-xs font-semibold text-sky-700 hover:bg-sky-50"
                                   th:text="#{topology.resources.nav-label}">
                                    Resources
                                </a>
                                <a th:href="@{/projects/{projectId}/environments/{environmentId}/edit(projectId=${project.id},environmentId=${item.environment.id})}"
                                   class="rounded border border-line px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-field"
                                   th:text="#{action.edit}">
                                    Edit
                                </a>
                                <form th:if="${item.active()}" method="post"
                                      th:action="@{/projects/{projectId}/environments/{environmentId}/archive(projectId=${project.id},environmentId=${item.environment.id})}">
                                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="rounded border border-amber-200 px-3 py-1.5 text-xs font-semibold text-amber-700 hover:bg-amber-50" th:text="#{action.disable}">
                                        Disable
                                    </button>
                                </form>
                                <form th:unless="${item.active()}" method="post"
                                      th:action="@{/projects/{projectId}/environments/{environmentId}/activate(projectId=${project.id},environmentId=${item.environment.id})}">
                                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="rounded border border-emerald-200 px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-50" th:text="#{action.enable}">
                                        Enable
                                    </button>
                                </form>
                                <form th:if="${item.deletable()}" method="post"
                                      th:action="@{/projects/{projectId}/environments/{environmentId}/delete(projectId=${project.id},environmentId=${item.environment.id})}">
                                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="rounded border border-rose-200 px-3 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-50" th:text="#{action.delete}">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>

            <section th:unless="${projectMutable}" class="rounded border border-line bg-white p-5 shadow-sm">
                <h2 class="text-base font-semibold" th:text="#{project-environments.manage.readonly.title}">Readonly project</h2>
                <p class="mt-2 text-sm text-slate-600" th:text="#{project-environments.manage.readonly.desc}">This project is archived, so environments can only be inspected.</p>
            </section>

            <form th:if="${projectMutable}" method="post" th:action="@{/projects/{id}/environments(id=${project.id})}" th:object="${form}"
                  class="rounded border border-line bg-white p-5 shadow-sm">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <h2 class="text-base font-semibold" th:text="#{project-environments.manage.new.title}">New environment</h2>

                <div class="mt-4">
                    <label for="name" class="mb-1.5 block text-sm font-medium" th:text="#{field.name}">Name</label>
                    <input id="name" th:field="*{name}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div class="mt-4">
                    <label for="region" class="mb-1.5 block text-sm font-medium" th:text="#{field.region}">Region</label>
                    <input id="region" th:field="*{region}" th:placeholder="${project.defaultRegion}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                    <p th:if="${#fields.hasErrors('region')}" th:errors="*{region}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div class="mt-4">
                    <label for="domain" class="mb-1.5 block text-sm font-medium" th:text="#{field.domain}">Domain</label>
                    <input id="domain" th:field="*{domain}" class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                    <p th:if="${#fields.hasErrors('domain')}" th:errors="*{domain}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <button type="submit" class="mt-5 w-full rounded bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800" th:text="#{project-environments.manage.submit}">
                    Create environment
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
