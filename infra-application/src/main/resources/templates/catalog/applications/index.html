<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/app-shell :: head(#{applications.page-title})}"></th:block>
</head>
<body class="min-h-screen bg-field text-ink">
<aside th:replace="~{fragments/app-shell :: sidebar('applications')}"></aside>
<main class="px-4 py-8 lg:pl-[19rem]">
    <div class="mx-auto max-w-7xl">
        <div class="mb-6 flex items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight" th:text="#{applications.title}">Applications</h1>
                <p class="mt-1 text-sm text-slate-600" th:text="#{applications.subtitle}">Deployable applications across active and archived projects.</p>
            </div>
            <a th:if="${!#lists.isEmpty(activeProjects)}" href="/applications/new"
               class="rounded bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800"
               th:text="#{applications.action.new}">
                New application
            </a>
        </div>

        <div th:if="${success}" class="mb-4 rounded border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
             th:text="${success}"></div>
        <div th:if="${error}" class="mb-4 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"
             th:text="${error}"></div>

        <section class="overflow-hidden rounded border border-line bg-white shadow-sm">
            <table class="min-w-full divide-y divide-line text-sm">
                <thead class="bg-field text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                    <th class="px-4 py-3" th:text="#{applications.col.application}">Application</th>
                    <th class="px-4 py-3" th:text="#{applications.col.project}">Project</th>
                    <th class="px-4 py-3" th:text="#{applications.col.build}">Build</th>
                    <th class="px-4 py-3" th:text="#{applications.col.target}">Target</th>
                    <th class="px-4 py-3" th:text="#{applications.col.runtime}">Runtime</th>
                    <th class="px-4 py-3" th:text="#{applications.col.port}">Port</th>
                    <th class="px-4 py-3" th:text="#{applications.col.status}">Status</th>
                    <th class="px-4 py-3 text-right" th:text="#{applications.col.actions}">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-line">
                <tr th:if="${#lists.isEmpty(applications)}">
                    <td colspan="8" class="px-4 py-10 text-center text-slate-500" th:text="#{applications.empty}">No applications yet.</td>
                </tr>
                <tr th:each="item : ${applications}" class="hover:bg-field">
                    <td class="px-4 py-3">
                        <p class="font-medium" th:text="${item.application.name}">Application</p>
                        <p class="font-mono text-xs text-slate-500" th:text="${item.application.key}">app-key</p>
                        <p th:if="${item.application.sourceLocation}" class="mt-1 max-w-xs truncate font-mono text-xs text-slate-500"
                           th:text="${item.application.sourceLocation}">source</p>
                    </td>
                    <td class="px-4 py-3">
                        <p class="font-medium" th:text="${item.application.project.name}">Project</p>
                        <p class="font-mono text-xs text-slate-500" th:text="${item.application.project.key}">project-key</p>
                    </td>
                    <td class="px-4 py-3" th:text="${item.application.buildType}">DOCKER</td>
                    <td class="px-4 py-3" th:text="${item.application.serviceType}">EC2</td>
                    <td class="px-4 py-3" th:text="${item.application.runtime ?: '-'}">java</td>
                    <td class="px-4 py-3" th:text="${item.application.defaultPort ?: '-'}">8080</td>
                    <td class="px-4 py-3">
                        <span th:if="${item.active()}" class="rounded bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700" th:text="#{status.active}">ACTIVE</span>
                        <span th:unless="${item.active()}" class="rounded bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-600" th:text="#{status.archived}">ARCHIVED</span>
                        <span th:unless="${item.projectMutable()}" class="ml-1 rounded bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-600" th:text="#{applications.status.project-readonly}">PROJECT READONLY</span>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex justify-end gap-2">
                            <a th:if="${item.projectMutable()}"
                               th:href="@{/applications/{id}/edit(id=${item.application.id})}"
                               class="rounded border border-line px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-field"
                               th:text="#{action.edit}">
                                Edit
                            </a>
                            <form th:if="${item.projectMutable() && item.active()}" method="post"
                                  th:action="@{/applications/{id}/archive(id=${item.application.id})}">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="rounded border border-amber-200 px-3 py-1.5 text-xs font-semibold text-amber-700 hover:bg-amber-50" th:text="#{action.disable}">
                                    Disable
                                </button>
                            </form>
                            <form th:if="${item.projectMutable() && !item.active()}" method="post"
                                  th:action="@{/applications/{id}/activate(id=${item.application.id})}">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="rounded border border-emerald-200 px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-50" th:text="#{action.enable}">
                                    Enable
                                </button>
                            </form>
                            <form th:if="${item.projectMutable() && item.deletable()}" method="post"
                                  th:action="@{/applications/{id}/delete(id=${item.application.id})}">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="rounded border border-rose-200 px-3 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-50" th:text="#{action.delete}">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</main>
</body>
</html>
