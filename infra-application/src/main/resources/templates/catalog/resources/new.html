<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/app-shell :: head(#{topology.resources.global.new.page-title})}"></th:block>
</head>
<body class="min-h-screen bg-field text-ink">
<aside th:replace="~{fragments/app-shell :: sidebar('resources')}"></aside>
<main class="px-4 py-8 lg:pl-[19rem]">
    <div class="mx-auto max-w-2xl">
        <div class="mb-6">
            <a href="/resources" class="text-sm font-medium text-accent hover:text-emerald-800" th:text="#{action.back.resources}">Back to resources</a>
            <h1 class="mt-3 text-2xl font-semibold tracking-tight" th:text="#{topology.resources.global.new.title}">New resource</h1>
        </div>

        <form method="post" action="/resources" th:object="${form}"
              class="rounded border border-line bg-white p-5 shadow-sm">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:if="${formError}" class="mb-5 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700"
                 th:text="${formError}"></div>

            <div class="space-y-4">
                <div>
                    <label for="environmentId" class="mb-1.5 block text-sm font-medium" th:text="#{topology.resources.global.form.field.environment}">Environment</label>
                    <select id="environmentId" th:field="*{environmentId}"
                            class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                        <option value="" th:text="#{topology.resources.global.form.select-environment}">Select environment</option>
                        <option th:each="env : ${environments}"
                                th:value="${env.id}"
                                th:text="|${env.project.name} / ${env.name}|">Project / env</option>
                    </select>
                    <p th:if="${#fields.hasErrors('environmentId')}" th:errors="*{environmentId}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="name" class="mb-1.5 block text-sm font-medium" th:text="#{field.name}">Name</label>
                    <input id="name" th:field="*{name}"
                           class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div>
                    <label for="cidrBlock" class="mb-1.5 block text-sm font-medium" th:text="#{topology.resources.form.field.cidr-block}">CIDR block</label>
                    <input id="cidrBlock" th:field="*{cidrBlock}" placeholder="10.0.0.0/16"
                           class="w-full rounded border border-line bg-white px-3 py-2 text-sm font-mono outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100">
                    <p th:if="${#fields.hasErrors('cidrBlock')}" th:errors="*{cidrBlock}" class="mt-1 text-xs text-rose-600"></p>
                </div>

                <div class="space-y-2">
                    <p class="text-sm font-medium" th:text="#{topology.resources.form.section.dns}">DNS settings</p>
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" th:field="*{enableDnsSupport}"
                               class="rounded border-line text-accent focus:ring-emerald-100">
                        <span th:text="#{topology.resources.form.field.enable-dns-support}">Enable DNS support</span>
                    </label>
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" th:field="*{enableDnsHostnames}"
                               class="rounded border-line text-accent focus:ring-emerald-100">
                        <span th:text="#{topology.resources.form.field.enable-dns-hostnames}">Enable DNS hostnames</span>
                    </label>
                </div>

                <div>
                    <label for="description" class="mb-1.5 block text-sm font-medium" th:text="#{field.description}">Description</label>
                    <textarea id="description" th:field="*{description}" rows="2"
                              class="w-full rounded border border-line bg-white px-3 py-2 text-sm outline-none focus:border-accent focus:ring-2 focus:ring-emerald-100"></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3 border-t border-line pt-5">
                <a href="/resources" class="rounded border border-line px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-field" th:text="#{action.cancel}">Cancel</a>
                <button type="submit"
                        class="rounded bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800"
                        th:text="#{topology.resources.form.submit}">Create resource</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
