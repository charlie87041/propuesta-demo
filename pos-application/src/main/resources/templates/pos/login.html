<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: "Plus Jakarta Sans", sans-serif; }</style>
</head>
<body class="bg-[#f8f7f6] text-[#1b130e] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-md bg-white border border-[#e6dad1] rounded-xl shadow-sm p-6 space-y-5">
    <div>
        <p class="text-xs uppercase tracking-wider text-[#956d50]">POS</p>
        <h1 class="text-2xl font-extrabold text-[#8b4513]">Ingreso a caja</h1>
        <p class="text-sm text-[#956d50]" th:text="'Source ID: ' + ${sourceId}">Source ID</p>
    </div>

    <div th:if="${param.error}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
        Credenciales invalidas o usuario sin asignacion POS activa para este source.
    </div>
    <div th:if="${param.posDisabled}" class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700">
        El POS no esta habilitado para este source.
    </div>
    <div th:if="${param.logout}" class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
        Sesion cerrada correctamente.
    </div>

    <form method="post" th:action="@{'/' + ${sourceId} + '/pos/login'}" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-semibold mb-1">Correo</label>
            <input id="email" name="email" type="email" required class="w-full rounded-lg border-[#e6dad1] focus:border-[#8b4513] focus:ring-[#8b4513]">
        </div>
        <div>
            <label for="password" class="block text-sm font-semibold mb-1">Contrasena</label>
            <input id="password" name="password" type="password" required class="w-full rounded-lg border-[#e6dad1] focus:border-[#8b4513] focus:ring-[#8b4513]">
        </div>
        <button type="submit" class="w-full px-4 py-2 bg-[#8b4513] hover:bg-[#6f370f] text-white rounded-lg text-sm font-bold">Entrar al POS</button>
    </form>
</div>
</body>
</html>
