<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, activeNav, routeSuffix, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">POS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; }
    </style>
</head>
<body class="bg-[#f7f8fa] text-[#0f172a] min-h-screen">
<div class="flex min-h-screen">
    <aside class="hidden lg:flex w-[260px] flex-col border-r border-[#e5e7eb] bg-[#0f172a] text-white">
        <div class="p-5 border-b border-white/10">
            <p class="text-xs uppercase tracking-[0.18em] text-slate-400" th:text="#{pos.layout.subtitle}">Point of Sale</p>
            <h1 class="mt-2 text-xl font-semibold" th:text="#{pos.layout.brand}">Cookies Store POS</h1>
            <p class="mt-1 text-xs text-slate-400" th:text="'Source ' + (${sourceCode != null ? sourceCode : sourceId})">Source</p>
        </div>

        <nav class="px-3 py-4 space-y-1 text-sm">
            <a th:href="@{'/' + ${sourceId} + '/pos/cash-drawer'}"
               class="flex items-center gap-2 rounded-lg px-3 py-2"
               th:classappend="${activeNav} == 'cash-drawer' ? ' bg-white/15 text-white font-semibold' : ' text-slate-300 hover:bg-white/10 hover:text-white'">
                <span class="material-symbols-outlined text-base">payments</span>
                <span th:text="#{pos.layout.nav.cashDrawer}">Caja</span>
            </a>
            <a th:href="@{'/' + ${sourceId} + '/pos/terminal'}"
               class="flex items-center gap-2 rounded-lg px-3 py-2"
               th:classappend="${activeNav} == 'terminal' ? ' bg-white/15 text-white font-semibold' : ' text-slate-300 hover:bg-white/10 hover:text-white'">
                <span class="material-symbols-outlined text-base">point_of_sale</span>
                <span th:text="#{pos.layout.nav.terminal}">Terminal</span>
            </a>
            <a th:href="@{'/' + ${sourceId} + '/pos/order-history'}"
               class="flex items-center gap-2 rounded-lg px-3 py-2"
               th:classappend="${activeNav} == 'order-history' ? ' bg-white/15 text-white font-semibold' : ' text-slate-300 hover:bg-white/10 hover:text-white'">
                <span class="material-symbols-outlined text-base">receipt_long</span>
                <span th:text="#{pos.layout.nav.history}">Historial</span>
            </a>
            <a th:href="@{'/' + ${sourceId} + '/pos/closing-session'}"
               class="flex items-center gap-2 rounded-lg px-3 py-2"
               th:classappend="${activeNav} == 'closing' ? ' bg-white/15 text-white font-semibold' : ' text-slate-300 hover:bg-white/10 hover:text-white'">
                <span class="material-symbols-outlined text-base">lock</span>
                <span th:text="#{pos.layout.nav.closing}">Cierre</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1">
        <header class="h-16 bg-white border-b border-[#e5e7eb] px-4 lg:px-8 flex items-center justify-between">
            <h2 class="text-base lg:text-lg font-semibold text-slate-900" th:text="${pageTitle}">POS</h2>
            <div class="flex items-center gap-3">
                <a class="text-xs font-semibold text-slate-500 hover:text-slate-900"
                   th:href="@{'/' + ${sourceId} + '/pos' + ${routeSuffix}(lang='es')}">ES</a>
                <span class="text-xs text-slate-300">|</span>
                <a class="text-xs font-semibold text-slate-500 hover:text-slate-900"
                   th:href="@{'/' + ${sourceId} + '/pos' + ${routeSuffix}(lang='en')}">EN</a>
                <form method="post" th:action="@{'/' + ${sourceId} + '/pos/logout'}">
                    <button type="submit" class="inline-flex items-center rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100" th:text="#{pos.layout.logout}">Logout</button>
                </form>
            </div>
        </header>

        <div th:replace="${content}"></div>
    </main>
</div>
</body>
</html>
