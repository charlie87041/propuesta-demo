<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{pos/layout :: layout(#{pos.closing.title}, 'closing', '/closing-session', ~{::content})}">
    <th:block th:fragment="content">

<section class="p-4 lg:p-8">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-6">
      <h3 class="text-lg font-semibold" th:text="#{pos.closing.heading}">Cierre de sesion</h3>
      <p class="mt-1 text-sm text-slate-500" th:text="#{pos.closing.subtitle}">Confirma montos y finaliza el turno.</p>
      <div class="mt-5 space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-slate-500">Ventas en efectivo</span><span>$245.00</span></div>
        <div class="flex justify-between"><span class="text-slate-500">Fondo inicial</span><span>$50.00</span></div>
        <div class="flex justify-between font-semibold border-t border-slate-200 pt-3"><span>Total esperado en caja</span><span>$295.00</span></div>
      </div>
      <button class="mt-6 rounded-lg bg-rose-600 text-white px-4 py-2 text-sm font-semibold" th:text="#{pos.closing.action}">Cerrar sesion</button>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-6">
      <h4 class="font-semibold" th:text="#{pos.closing.alertTitle}">Atencion</h4>
      <p class="mt-2 text-sm text-slate-600" th:text="#{pos.closing.alertBody}">Al cerrar se bloquean nuevas ventas hasta la siguiente apertura.</p>
    </div>
  </div>
</section>

    </th:block>
</th:block>
</html>
