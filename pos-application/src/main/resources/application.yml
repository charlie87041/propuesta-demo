server:
  port: ${POS_SERVER_PORT:8081}

spring:
  application:
    name: cookies-store-pos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://core-factu-api-pgsql:5432/cookies_store}
    username: ${SPRING_DATASOURCE_USERNAME:core}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: false
