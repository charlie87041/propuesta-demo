<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions"></th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 max-w-6xl mx-auto w-full space-y-6">
            <nav class="text-sm text-[#956d50]">
                <a th:href="@{/admin/product-template}" class="hover:text-[#8b4513]" th:text="#{admin.product_templates.title}">Product templates</a>
                <span class="mx-2">/</span>
                <span th:text="${isEdit} ? #{admin.product_templates.edit.title} : #{admin.product_templates.create.title}">Create product template</span>
            </nav>

            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <form th:action="${formAction}" th:object="${form}" method="post" class="space-y-6">
                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">inventory_2</span>
                            <span th:text="#{admin.product_templates.form.section.details}">Template details</span>
                        </h4>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.product_templates.form.code}">Code</span>
                            <input name="code" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{code}" required>
                            <span th:if="${#fields.hasErrors('code')}" class="text-xs font-semibold text-red-700" th:errors="*{code}"></span>
                        </label>

                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.product_templates.form.name}">Name</span>
                            <input name="name" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{name}" required>
                            <span th:if="${#fields.hasErrors('name')}" class="text-xs font-semibold text-red-700" th:errors="*{name}"></span>
                        </label>

                        <label class="md:col-span-2 flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.product_templates.form.description}">Description</span>
                            <textarea name="description" rows="3" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{description}"></textarea>
                            <span th:if="${#fields.hasErrors('description')}" class="text-xs font-semibold text-red-700" th:errors="*{description}"></span>
                        </label>

                        <div class="md:col-span-2 flex items-center justify-between border border-[#f3ece8] rounded-lg px-4 py-3 bg-[#fcfaf9]">
                            <div>
                                <p class="text-sm font-bold" th:text="#{admin.product_templates.form.status}">Status</p>
                                <p id="templateStatusText"
                                   class="text-xs text-[#956d50]"
                                   th:text="*{active} ? #{admin.product_templates.status.active} : #{admin.product_templates.status.inactive}"
                                   th:attr="data-active-text=#{admin.product_templates.status.active},data-inactive-text=#{admin.product_templates.status.inactive}">Active</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input id="templateActiveToggle" class="sr-only peer" type="checkbox" th:field="*{active}"/>
                                <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8b4513]"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30 flex items-center justify-between">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">table_rows</span>
                            <span th:text="#{admin.product_templates.form.section.fields}">Template fields</span>
                        </h4>
                        <button id="addTemplateFieldBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-[#8b4513] text-white hover:bg-[#6f370f]" th:text="#{admin.product_templates.form.fields.add}">
                            Add field
                        </button>
                    </div>
                    <div class="p-6">
                        <div class="overflow-x-auto border border-[#f3ece8] rounded-lg">
                            <table class="w-full text-left text-sm" id="templateFieldsTable">
                                <thead class="bg-[#fcfaf9] text-xs uppercase tracking-wider text-[#956d50]">
                                <tr>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.key}">Key</th>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.label}">Label</th>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.type}">Type</th>
                                    <th class="px-3 py-2 text-center" th:text="#{admin.product_templates.form.fields.required}">Required</th>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.defaultValue}">Default</th>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.validation}">Validation</th>
                                    <th class="px-3 py-2" th:text="#{admin.product_templates.form.fields.sortOrder}">Order</th>
                                    <th class="px-3 py-2 text-right" th:text="#{admin.product_templates.form.fields.actions}">Actions</th>
                                </tr>
                                </thead>
                                <tbody id="templateFieldsBody">
                                <tr th:if="${form.fields.empty}" data-field-row>
                                    <td class="px-3 py-3">
                                        <input type="hidden" name="fields[0].id" value="">
                                        <input type="hidden" name="fields[0].templateId" value="">
                                        <input name="fields[0].fieldKey" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" />
                                    </td>
                                    <td class="px-3 py-3">
                                        <input name="fields[0].label" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" />
                                    </td>
                                    <td class="px-3 py-3">
                                        <select name="fields[0].fieldType" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">
                                            <option th:each="fieldType : ${T(com.cookiesstore.common.entities.ProductTemplateFieldType).values()}"
                                                    th:value="${fieldType.name()}"
                                                    th:text="${fieldType.name()}">TEXT</option>
                                        </select>
                                    </td>
                                    <td class="px-3 py-3 text-center">
                                        <input name="fields[0].required" type="checkbox" class="rounded border-[#f3ece8] text-[#8b4513] focus:ring-[#8b4513]/20">
                                    </td>
                                    <td class="px-3 py-3">
                                        <input name="fields[0].defaultValue" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" />
                                    </td>
                                    <td class="px-3 py-3">
                                        <input name="fields[0].validationRules" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" />
                                    </td>
                                    <td class="px-3 py-3">
                                        <input name="fields[0].sortOrder" type="number" min="0" value="0" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-20" />
                                    </td>
                                    <td class="px-3 py-3 text-right">
                                        <button type="button" class="text-red-700 font-semibold remove-template-field-row" th:text="#{admin.product_templates.form.fields.remove}">Remove</button>
                                    </td>
                                </tr>

                                <tr th:each="field,iter : ${form.fields}" data-field-row>
                                    <td class="px-3 py-3">
                                        <input type="hidden" th:name="|fields[${iter.index}].id|" th:value="${field.id}">
                                        <input type="hidden" th:name="|fields[${iter.index}].templateId|" th:value="${field.templateId}">
                                        <input th:name="|fields[${iter.index}].fieldKey|" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" th:value="${field.fieldKey}">
                                    </td>
                                    <td class="px-3 py-3">
                                        <input th:name="|fields[${iter.index}].label|" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" th:value="${field.label}">
                                    </td>
                                    <td class="px-3 py-3">
                                        <select th:name="|fields[${iter.index}].fieldType|" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">
                                            <option th:each="fieldType : ${T(com.cookiesstore.common.entities.ProductTemplateFieldType).values()}"
                                                    th:value="${fieldType.name()}"
                                                    th:selected="${field.fieldType != null && field.fieldType.name() == fieldType.name()}"
                                                    th:text="${fieldType.name()}">TEXT</option>
                                        </select>
                                    </td>
                                    <td class="px-3 py-3 text-center">
                                        <input th:name="|fields[${iter.index}].required|" type="checkbox" class="rounded border-[#f3ece8] text-[#8b4513] focus:ring-[#8b4513]/20" th:checked="${field.required}">
                                    </td>
                                    <td class="px-3 py-3">
                                        <input th:name="|fields[${iter.index}].defaultValue|" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" th:value="${field.defaultValue}">
                                    </td>
                                    <td class="px-3 py-3">
                                        <input th:name="|fields[${iter.index}].validationRules|" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full" th:value="${field.validationRules}">
                                    </td>
                                    <td class="px-3 py-3">
                                        <input th:name="|fields[${iter.index}].sortOrder|" type="number" min="0" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-20" th:value="${field.sortOrder}">
                                    </td>
                                    <td class="px-3 py-3 text-right">
                                        <button type="button" class="text-red-700 font-semibold remove-template-field-row" th:text="#{admin.product_templates.form.fields.remove}">Remove</button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <a th:href="@{/admin/product-template}" class="px-5 py-2.5 text-sm font-bold text-[#956d50]" th:text="#{admin.product_templates.form.cancel}">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="${submitLabel}">Save</button>
                </div>
            </form>
        </section>

        <script>
            (function () {
                var toggle = document.getElementById("templateActiveToggle");
                var statusText = document.getElementById("templateStatusText");
                if (toggle && statusText) {
                    var activeText = statusText.getAttribute("data-active-text") || "Active";
                    var inactiveText = statusText.getAttribute("data-inactive-text") || "Inactive";
                    var syncStatus = function () {
                        statusText.textContent = toggle.checked ? activeText : inactiveText;
                    };
                    toggle.addEventListener("change", syncStatus);
                    syncStatus();
                }

                var body = document.getElementById("templateFieldsBody");
                var addBtn = document.getElementById("addTemplateFieldBtn");
                if (!body || !addBtn) {
                    return;
                }

                function reindexRows() {
                    var rows = body.querySelectorAll("tr[data-field-row]");
                    rows.forEach(function (row, index) {
                        row.querySelectorAll("input,select,textarea").forEach(function (input) {
                            var name = input.getAttribute("name");
                            if (!name) return;
                            input.setAttribute("name", name.replace(/fields\\[\\d+\\]/, "fields[" + index + "]"));
                        });
                    });
                }

                function buildRow(index) {
                    var row = document.createElement("tr");
                    row.setAttribute("data-field-row", "");
                    row.innerHTML = '' +
                        '<td class="px-3 py-3">' +
                        '  <input type="hidden" name="fields[' + index + '].id" value="">' +
                        '  <input type="hidden" name="fields[' + index + '].templateId" value="">' +
                        '  <input name="fields[' + index + '].fieldKey" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">' +
                        '</td>' +
                        '<td class="px-3 py-3">' +
                        '  <input name="fields[' + index + '].label" type="text" required class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">' +
                        '</td>' +
                        '<td class="px-3 py-3">' +
                        '  <select name="fields[' + index + '].fieldType" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">' +
                        '    <option value="TEXT">TEXT</option>' +
                        '    <option value="LONG_TEXT">LONG_TEXT</option>' +
                        '    <option value="NUMBER">NUMBER</option>' +
                        '    <option value="BOOLEAN">BOOLEAN</option>' +
                        '    <option value="DATE">DATE</option>' +
                        '    <option value="DATETIME">DATETIME</option>' +
                        '    <option value="SELECT">SELECT</option>' +
                        '    <option value="MULTISELECT">MULTISELECT</option>' +
                        '  </select>' +
                        '</td>' +
                        '<td class="px-3 py-3 text-center">' +
                        '  <input name="fields[' + index + '].required" type="checkbox" class="rounded border-[#f3ece8] text-[#8b4513] focus:ring-[#8b4513]/20">' +
                        '</td>' +
                        '<td class="px-3 py-3">' +
                        '  <input name="fields[' + index + '].defaultValue" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">' +
                        '</td>' +
                        '<td class="px-3 py-3">' +
                        '  <input name="fields[' + index + '].validationRules" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-full">' +
                        '</td>' +
                        '<td class="px-3 py-3">' +
                        '  <input name="fields[' + index + '].sortOrder" type="number" min="0" value="' + index + '" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm w-20">' +
                        '</td>' +
                        '<td class="px-3 py-3 text-right">' +
                        '  <button type="button" class="text-red-700 font-semibold remove-template-field-row">Remove</button>' +
                        '</td>';
                    return row;
                }

                addBtn.addEventListener("click", function () {
                    var index = body.querySelectorAll("tr[data-field-row]").length;
                    body.appendChild(buildRow(index));
                });

                body.addEventListener("click", function (event) {
                    var btn = event.target.closest(".remove-template-field-row");
                    if (!btn) return;
                    var row = btn.closest("tr[data-field-row]");
                    if (!row) return;
                    row.remove();
                    reindexRows();
                });
            })();
        </script>
    </th:block>
</th:block>
</html>
