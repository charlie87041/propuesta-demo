<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions"></th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 max-w-5xl mx-auto w-full space-y-6">
            <nav class="text-sm text-[#956d50]">
                <a th:href="@{/admin/categories}" class="hover:text-[#8b4513]" th:text="#{admin.categories.title}">Category Management</a>
                <span class="mx-2">/</span>
                <span th:text="${isEdit} ? #{admin.categories.edit.title} : #{admin.categories.create.title}">Create category</span>
            </nav>

            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <form th:action="${formAction}" th:object="${form}" method="post" class="space-y-6">
                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">category</span>
                            <span th:text="#{admin.categories.form.section.details}">Category Details</span>
                        </h4>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.code}">Code</span>
                            <input name="code" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{code}" required>
                            <span th:if="${#fields.hasErrors('code')}" class="text-xs font-semibold text-red-700" th:errors="*{code}"></span>
                        </label>

                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.name}">Name</span>
                            <input name="name" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{name}" required>
                            <span th:if="${#fields.hasErrors('name')}" class="text-xs font-semibold text-red-700" th:errors="*{name}"></span>
                        </label>

                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.slug}">Slug</span>
                            <input name="slug" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{slug}" required>
                            <span th:if="${#fields.hasErrors('slug')}" class="text-xs font-semibold text-red-700" th:errors="*{slug}"></span>
                        </label>

                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.order}">Order</span>
                            <input name="sortOrder" type="number" min="0" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{sortOrder}" required>
                            <span th:if="${#fields.hasErrors('sortOrder')}" class="text-xs font-semibold text-red-700" th:errors="*{sortOrder}"></span>
                        </label>

                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.productTemplate}">Product template</span>
                            <select name="productTemplateId"
                                    class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm"
                                    th:field="*{productTemplateId}"
                                    required>
                                <option value="" th:text="#{admin.categories.form.productTemplate.placeholder}">Select template</option>
                                <option th:each="template : ${productTemplates}"
                                        th:value="${template.id}"
                                        th:text="${template.name + ' (' + template.code + ')'}">Template</option>
                            </select>
                            <span th:if="${#fields.hasErrors('productTemplateId')}" class="text-xs font-semibold text-red-700" th:errors="*{productTemplateId}"></span>
                        </label>

                        <label class="md:col-span-2 flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.categories.form.description}">Description</span>
                            <textarea name="description" rows="4" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{description}"></textarea>
                            <span th:if="${#fields.hasErrors('description')}" class="text-xs font-semibold text-red-700" th:errors="*{description}"></span>
                        </label>

                        <div class="md:col-span-2 flex items-center justify-between border border-[#f3ece8] rounded-lg px-4 py-3 bg-[#fcfaf9]">
                            <div>
                                <p class="text-sm font-bold" th:text="#{admin.categories.form.status}">Status</p>
                                <p id="categoryStatusText"
                                   class="text-xs text-[#956d50]"
                                   th:text="*{active} ? #{admin.categories.status.active} : #{admin.categories.status.inactive}"
                                   th:attr="data-active-text=#{admin.categories.status.active},data-inactive-text=#{admin.categories.status.inactive}">Active</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input id="categoryActiveToggle" class="sr-only peer" type="checkbox" th:field="*{active}"/>
                                <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8b4513]"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <a th:href="@{/admin/categories}" class="px-5 py-2.5 text-sm font-bold text-[#956d50]" th:text="#{admin.categories.form.cancel}">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="${submitLabel}">Save</button>
                </div>
            </form>
        </section>

        <script>
            (function () {
                var toggle = document.getElementById("categoryActiveToggle");
                var statusText = document.getElementById("categoryStatusText");
                if (!toggle || !statusText) {
                    return;
                }

                var activeText = statusText.getAttribute("data-active-text") || "Active";
                var inactiveText = statusText.getAttribute("data-inactive-text") || "Inactive";

                function syncStatus() {
                    statusText.textContent = toggle.checked ? activeText : inactiveText;
                }

                toggle.addEventListener("change", syncStatus);
                syncStatus();
            })();
        </script>
    </th:block>
</th:block>
</html>
