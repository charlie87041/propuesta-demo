<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(#{admin.categories.title}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <th:block th:replace="~{backoffice/fragments/searching :: searchBox('q', #{admin.categories.search.placeholder}, ${searchQuery}, 'categoriesSortForm')}"></th:block>
            <a th:href="@{/admin/categories/new}" class="px-4 py-2 bg-[#8b4513] hover:bg-[#6f370f] text-white rounded-lg text-sm font-bold whitespace-nowrap" th:text="#{admin.categories.add}">
                Add Category
            </a>
        </div>
    </th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 space-y-6">
            <div th:if="${successMessage}" class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <article class="bg-white rounded-xl border border-[#e6dad1] overflow-hidden">
                <header class="px-6 py-4 border-b border-[#e6dad1] flex items-center justify-between">
                    <h3 class="font-bold" th:text="#{admin.categories.directory}">Categories Directory</h3>
                    <span class="text-sm text-[#956d50]" th:text="#{admin.categories.totalCount(${categoriesPage.totalElements})}">0 categories</span>
                </header>

                <form method="get" th:action="@{/admin/categories}" id="categoriesSortForm">
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="size" th:value="${categoriesPage.size}">
                    <input type="hidden" name="q" th:value="${searchQuery}">
                </form>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-[#fcfaf9] text-xs uppercase tracking-wider text-[#956d50]">
                        <tr>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.id}, 'id', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.code}, 'code', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.name}, 'name', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.slug}, 'slug', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.order}, 'sortOrder', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.categories.col.status}, 'active', true, ${sortParams}, 'categoriesSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3 text-right" th:text="#{admin.categories.col.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-[#f3ece8] text-sm">
                        <tr th:if="${categoriesPage.totalElements == 0}">
                            <td colspan="7" class="px-6 py-8 text-center text-[#956d50]" th:text="#{admin.categories.empty}">No categories found.</td>
                        </tr>
                        <tr th:each="category : ${categoriesPage.content}">
                            <td class="px-6 py-4 font-semibold" th:text="${category.id}">1</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${category.code}">signature</td>
                            <td class="px-6 py-4" th:text="${category.name}">Signature</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${category.slug}">signature-range</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${category.sortOrder}">0</td>
                            <td class="px-6 py-4" th:text="${category.active} ? #{admin.categories.status.active} : #{admin.categories.status.inactive}"
                                th:classappend="${category.active} ? ' text-green-700 font-semibold' : ' text-slate-600 font-semibold'">Active</td>
                            <td class="px-6 py-4 text-right">
                                <div class="inline-flex items-center gap-4" th:if="${category.active}">
                                    <a th:href="@{'/admin/categories/' + ${category.id} + '/edit'}" class="text-[#8b4513] font-semibold hover:underline" th:text="#{admin.categories.action.edit}">Edit</a>
                                    <form th:action="@{'/admin/categories/' + ${category.id} + '/deactivate'}" method="post" class="inline">
                                        <button type="submit" class="text-red-700 font-semibold hover:underline" th:text="#{admin.categories.action.deactivate}">Deactivate</button>
                                    </form>
                                </div>
                                <div class="inline-flex items-center gap-4" th:if="${!category.active}">
                                    <a th:href="@{'/admin/categories/' + ${category.id} + '/edit'}" class="text-[#8b4513] font-semibold hover:underline" th:text="#{admin.categories.action.edit}">Edit</a>
                                    <form th:action="@{'/admin/categories/' + ${category.id} + '/enable'}" method="post" class="inline">
                                        <button type="submit" class="text-green-700 font-semibold hover:underline" th:text="#{admin.categories.action.enable}">Enable</button>
                                    </form>
                                    <form th:action="@{'/admin/categories/' + ${category.id} + '/delete'}" method="post" class="inline">
                                        <button type="submit" class="text-red-700 font-semibold hover:underline" th:text="#{admin.categories.action.delete}">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <th:block th:replace="~{backoffice/fragments/sorting :: script}"></th:block>
                <th:block th:replace="~{backoffice/fragments/searching :: script}"></th:block>
                <th:block th:if="${categoriesPage.totalElements > 0}"
                          th:replace="~{backoffice/fragments/pagination :: pager(${categoriesPage}, '/admin/categories')}"></th:block>
            </article>
        </section>
    </th:block>
</th:block>
</html>
