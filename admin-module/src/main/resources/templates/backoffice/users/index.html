<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(#{admin.users.title}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <th:block th:replace="~{backoffice/fragments/searching :: searchBox('q', #{admin.users.search.placeholder}, ${searchQuery}, 'usersSortForm')}"></th:block>
            <a href="/admin/users/new" class="px-4 py-2 bg-[#8b4513] hover:bg-[#6f370f] text-white rounded-lg text-sm font-bold whitespace-nowrap" th:text="#{admin.users.add}">
                Add New User
            </a>
        </div>
    </th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 space-y-6">
            <div th:if="${successMessage}" class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <article class="bg-white rounded-xl border border-[#e6dad1] overflow-hidden">
                <header class="px-6 py-4 border-b border-[#e6dad1] flex items-center justify-between">
                    <h3 class="font-bold" th:text="#{admin.users.directory}">Internal Staff Directory</h3>
                    <span class="text-sm text-[#956d50]" th:text="#{admin.users.activeCount(${usersPage.totalElements}, ${domainCode})}">0 active users</span>
                </header>
                <form method="get" action="/admin/users" id="usersSortForm">
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="size" th:value="${usersPage.size}">
                    <input type="hidden" name="q" th:value="${searchQuery}">
                </form>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-[#fcfaf9] text-xs uppercase tracking-wider text-[#956d50]">
                        <tr>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.users.col.id}, 'id', true, ${sortParams}, 'usersSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.users.col.email}, 'email', true, ${sortParams}, 'usersSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.users.col.role}, 'role', false, ${sortParams}, 'usersSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.users.col.status}, 'active', true, ${sortParams}, 'usersSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3">
                                <th:block th:replace="~{backoffice/fragments/sorting :: columnHeader(#{admin.users.col.createdAt}, 'createdAt', true, ${sortParams}, 'usersSortForm')}"></th:block>
                            </th>
                            <th class="px-6 py-3 text-right" th:text="#{admin.users.col.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-[#f3ece8] text-sm">
                        <tr th:if="${usersPage.totalElements == 0}">
                            <td colspan="6" class="px-6 py-8 text-center text-[#956d50]" th:text="#{admin.users.empty}">No admin users found.</td>
                        </tr>
                        <tr th:each="user : ${usersPage.content}">
                            <td class="px-6 py-4 font-semibold" th:text="${user.id}">1</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${user.email}">admin@crumbly.com</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${userRoles[user.id]} ?: '-'">manage-users</td>
                            <td class="px-6 py-4 text-green-700 font-semibold" th:text="${user.active} ? #{admin.users.status.active} : #{admin.users.status.inactive}">Active</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
                            <td class="px-6 py-4 text-right">
                                <div th:if="${user.active}" class="inline-flex items-center gap-4">
                                    <a th:href="@{'/admin/users/' + ${user.id} + '/edit'}" class="text-[#8b4513] font-semibold hover:underline" th:text="#{admin.users.action.edit}">Edit</a>
                                    <form th:action="@{'/admin/users/' + ${user.id} + '/deactivate'}" method="post" class="inline">
                                        <button type="submit" class="text-red-700 font-semibold hover:underline" th:text="#{admin.users.action.deactivate}">Deactivate</button>
                                    </form>
                                </div>

                                <div th:if="${!user.active}" class="inline-flex items-center gap-4">
                                    <a th:href="@{'/admin/users/' + ${user.id} + '/edit'}" class="text-[#8b4513] font-semibold hover:underline" th:text="#{admin.users.action.edit}">Edit</a>
                                    <form th:action="@{'/admin/users/' + ${user.id} + '/enable'}" method="post" class="inline">
                                        <button type="submit" class="text-red-700 font-semibold hover:underline" th:text="#{admin.users.action.enable}">Enable</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <th:block th:replace="~{backoffice/fragments/sorting :: script}"></th:block>
                <th:block th:replace="~{backoffice/fragments/searching :: script}"></th:block>
                <th:block th:if="${usersPage.totalElements > 0}"
                          th:replace="~{backoffice/fragments/pagination :: pager(${usersPage}, '/admin/users')}"></th:block>
            </article>
        </section>
    </th:block>
</th:block>
</html>
