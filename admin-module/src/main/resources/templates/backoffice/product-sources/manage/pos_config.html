<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions">
        <a th:href="@{/admin/product-sources}" class="px-3 py-2 border border-[#e6dad1] rounded-lg text-sm font-semibold text-[#8b4513] hover:bg-[#8b4513]/10" th:text="#{admin.product_sources.manage.back}">
            Volver a sources
        </a>
    </th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 max-w-7xl mx-auto space-y-6">
            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" th:text="${successMessage}"></div>

            <nav class="text-sm text-[#956d50]">
                <a th:href="@{/admin/product-sources}" class="hover:text-[#8b4513]" th:text="#{admin.product_sources.title}">Source management</a>
                <span class="mx-2">/</span>
                <span th:text="#{admin.product_sources.manage.pos.config.title}">POS configuration</span>
            </nav>

            <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">
                <aside class="bg-white rounded-xl border border-[#e6dad1] shadow-sm p-4 h-fit">
                    <p class="text-xs uppercase tracking-wider text-[#956d50] px-2" th:text="#{admin.product_sources.manage.currentSource}">Current source</p>
                    <p class="font-bold text-[#8b4513] px-2 mt-1" th:text="${source.name}">Warehouse North</p>
                    <p class="text-xs text-[#956d50] px-2 mb-4" th:text="${source.code}">WAREHOUSE_NORTH</p>

                    <nav class="space-y-1">
                        <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/inventory'}" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.inventory}">Inventory</a>
                        <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/movements'}" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.movements}">Movements</a>
                        <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage'(section='purchase-orders')}" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.purchaseOrders}">Purchase orders</a>
                        <div>
                            <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage'(section='transfers')}" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.transfers}">Transfers</a>
                            <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/incidents'}" class="block mt-1 ml-3 px-3 py-1.5 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.incidents}">Incidents</a>
                        </div>
                        <div>
                            <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/pos-config'}"
                               class="block px-3 py-2 rounded-lg text-sm font-semibold"
                               th:classappend="${manageSection == 'pos-config' or manageSection == 'pos-users'} ? ' bg-[#8b4513]/10 text-[#8b4513]' : ' text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]'"
                               th:text="#{admin.product_sources.manage.nav.pos}">POS</a>
                            <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/pos-config'}"
                               class="block mt-1 ml-3 px-3 py-1.5 rounded-lg text-sm font-semibold"
                               th:classappend="${manageSection == 'pos-config'} ? ' bg-[#8b4513]/10 text-[#8b4513]' : ' text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]'"
                               th:text="#{admin.product_sources.manage.nav.posConfig}">Configuracion</a>
                            <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage/pos-users'}"
                               class="block mt-1 ml-3 px-3 py-1.5 rounded-lg text-sm font-semibold"
                               th:classappend="${manageSection == 'pos-users'} ? ' bg-[#8b4513]/10 text-[#8b4513]' : ' text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]'"
                               th:text="#{admin.product_sources.manage.nav.posUsers}">Usuarios</a>
                        </div>
                        <a th:href="@{'/admin/product-sources/' + ${source.id} + '/manage'(section='alerts')}" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[#956d50] hover:bg-[#8b4513]/10 hover:text-[#8b4513]" th:text="#{admin.product_sources.manage.nav.alerts}">Alerts</a>
                    </nav>
                </aside>

                <div class="space-y-6">
                    <form method="post" th:action="@{'/admin/product-sources/' + ${source.id} + '/manage/pos-config'}" th:object="${form}" class="space-y-6">
                        <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                            <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30">
                                <h4 class="font-bold text-[#8b4513]" th:text="#{admin.product_sources.manage.pos.config.section}">Configuracion del POS</h4>
                            </div>

                            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2 flex items-center justify-between border border-[#f3ece8] rounded-lg px-4 py-3 bg-[#fcfaf9]">
                                    <div>
                                        <p class="text-sm font-bold" th:text="#{admin.product_sources.manage.pos.config.enabled}">POS activo</p>
                                        <p class="text-xs text-[#956d50]" th:text="*{posEnabled} ? #{admin.product_sources.manage.pos.config.enabled.on} : #{admin.product_sources.manage.pos.config.enabled.off}">Activo</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input class="sr-only peer" type="checkbox" th:field="*{posEnabled}"/>
                                        <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8b4513]"></div>
                                    </label>
                                </div>

                                <label class="flex flex-col gap-1.5 md:col-span-2">
                                    <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.product_sources.manage.pos.config.currency}">Moneda por defecto</span>
                                    <select th:field="*{defaultCurrencyCode}" class="w-full rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" required>
                                        <option value="" th:text="#{admin.product_sources.manage.pos.config.currency.placeholder}">Selecciona moneda</option>
                                        <option th:each="currency : ${currencies}" th:value="${currency.code}" th:text="${currency.code + ' - ' + currency.name}">USD - US Dollar</option>
                                    </select>
                                    <span th:if="${#fields.hasErrors('defaultCurrencyCode')}" class="text-xs font-semibold text-red-700" th:errors="*{defaultCurrencyCode}"></span>
                                </label>
                            </div>
                        </div>

                        <div class="flex items-center justify-end">
                            <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-[#8b4513] rounded-lg hover:bg-[#6f370f]" th:text="#{admin.product_sources.manage.pos.config.submit}">Guardar configuracion</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </th:block>
</th:block>
</html>
