<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions">
        <div class="flex items-center gap-3 w-full md:w-auto">
            <th:block th:replace="~{backoffice/fragments/searching :: searchBox('q', #{admin.settings.currencies.search.placeholder}, ${searchQuery}, 'currenciesSortForm')}"></th:block>
            <a th:href="@{/admin/settings/currencies/new}"
               class="px-4 py-2 bg-[#8b4513] hover:bg-[#6f370f] text-white rounded-lg text-sm font-bold whitespace-nowrap"
               th:text="#{admin.settings.currencies.add}">
                Add currency
            </a>
        </div>
    </th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 space-y-6">
            <div th:if="${successMessage}" class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <article class="bg-white rounded-xl border border-[#e6dad1] overflow-hidden">
                <header class="px-6 py-4 border-b border-[#e6dad1] flex items-center justify-between">
                    <h3 class="font-bold" th:text="#{admin.settings.currencies.directory}">Currencies Directory</h3>
                    <span class="text-sm text-[#956d50]" th:text="#{admin.settings.currencies.totalCount(${currenciesPage.totalElements})}">0 currencies</span>
                </header>

                <form method="get" th:action="@{/admin/settings/currencies}" id="currenciesSortForm">
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="size" th:value="${currenciesPage.size}">
                    <input type="hidden" name="q" th:value="${searchQuery}">
                </form>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-[#fcfaf9] text-xs uppercase tracking-wider text-[#956d50]">
                        <tr>
                            <th class="px-6 py-3" th:text="#{admin.settings.currencies.col.code}">Code</th>
                            <th class="px-6 py-3" th:text="#{admin.settings.currencies.col.name}">Name</th>
                            <th class="px-6 py-3" th:text="#{admin.settings.currencies.col.symbol}">Symbol</th>
                            <th class="px-6 py-3" th:text="#{admin.settings.currencies.col.fractionDigits}">Fraction digits</th>
                            <th class="px-6 py-3" th:text="#{admin.settings.currencies.col.status}">Status</th>
                            <th class="px-6 py-3 text-right" th:text="#{admin.settings.currencies.col.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-[#f3ece8] text-sm">
                        <tr th:if="${currenciesPage.totalElements == 0}">
                            <td colspan="6" class="px-6 py-8 text-center text-[#956d50]" th:text="#{admin.settings.currencies.empty}">No currencies found.</td>
                        </tr>
                        <tr th:each="currency : ${currenciesPage.content}">
                            <td class="px-6 py-4 font-semibold" th:text="${currency.code}">USD</td>
                            <td class="px-6 py-4" th:text="${currency.name}">US Dollar</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${currency.symbol} ?: '-'">$</td>
                            <td class="px-6 py-4 text-[#956d50]" th:text="${currency.fractionDigits}">2</td>
                            <td class="px-6 py-4"
                                th:text="${currency.active} ? #{admin.settings.currencies.status.active} : #{admin.settings.currencies.status.inactive}"
                                th:classappend="${currency.active} ? ' text-green-700 font-semibold' : ' text-slate-600 font-semibold'">
                                Active
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="inline-flex items-center gap-4">
                                    <a th:href="@{'/admin/settings/currencies/' + ${currency.code} + '/edit'}"
                                       class="text-[#8b4513] font-semibold hover:underline"
                                       th:text="#{admin.settings.currencies.action.edit}">Edit</a>
                                    <form th:action="@{'/admin/settings/currencies/' + ${currency.code} + '/delete'}" method="post" class="inline">
                                        <button type="submit" class="text-red-700 font-semibold hover:underline" th:text="#{admin.settings.currencies.action.delete}">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <th:block th:replace="~{backoffice/fragments/searching :: script}"></th:block>
                <th:block th:if="${currenciesPage.totalElements > 0}"
                          th:replace="~{backoffice/fragments/pagination :: pager(${currenciesPage}, '/admin/settings/currencies')}"></th:block>
            </article>
        </section>
    </th:block>
</th:block>
</html>
