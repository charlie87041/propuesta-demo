<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions"></th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 max-w-5xl mx-auto w-full space-y-6">
            <nav class="text-sm text-[#956d50]">
                <a href="/admin/customers" class="hover:text-[#8b4513]" th:text="#{admin.customers.title}">Customer Management</a>
                <span class="mx-2">/</span>
                <span th:text="${isEdit} ? #{admin.customers.edit.title} : #{admin.customers.create}">Create customer</span>
            </nav>

            <div th:if="${successMessage}" class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700" th:text="${successMessage}"></div>
            <div th:if="${warningMessage}" class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700" th:text="${warningMessage}"></div>
            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <form th:action="${isEdit} ? @{/admin/customers/{customerId}(customerId=${customerId})} : @{/admin/customers}" th:object="${form}" method="post" enctype="multipart/form-data" class="space-y-6">
                <div class="bg-white rounded-xl border border-[#f3ece8] p-6 shadow-sm flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
                    <div class="flex items-center gap-5">
                        <div class="size-20 rounded-full border-4 border-[#f3ece8] bg-[#f8f7f6] flex items-center justify-center text-[#8b4513]/60">
                            <span class="material-symbols-outlined text-3xl">person</span>
                        </div>
                        <div class="space-y-2">
                            <p class="text-sm font-bold text-[#1b130e]" th:text="#{admin.customers.avatar}">Avatar</p>
                            <label class="inline-flex items-center gap-2 px-3 py-2 text-xs font-bold text-[#8b4513] border border-[#e6dad1] rounded-lg hover:bg-[#f8f7f6] cursor-pointer">
                                <span class="material-symbols-outlined text-base">upload</span>
                                <span th:text="#{admin.customers.avatar.upload}">Upload image</span>
                                <input type="file" name="avatar" accept="image/png,image/jpeg,image/webp" class="hidden">
                            </label>
                            <p class="text-xs text-[#8b4513]/60" th:text="#{admin.customers.avatar.help}">PNG/JPG/WEBP up to 5MB.</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-4 lg:min-w-[220px]">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-[#8b4513]/60" th:text="#{admin.customers.status.label}">Account Status</p>
                            <p id="customerStatusText"
                               class="text-sm font-semibold text-[#8b4513]"
                               th:text="*{active} ? #{admin.customers.status.active} : #{admin.customers.status.inactive}"
                               th:attr="data-active-text=#{admin.customers.status.active},data-inactive-text=#{admin.customers.status.inactive}">Active</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input id="customerActiveToggle" class="sr-only peer" type="checkbox" th:field="*{active}"/>
                            <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8b4513]"></div>
                        </label>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">person</span>
                            <span th:text="#{admin.customers.section.personal}">Personal Information</span>
                        </h4>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.name}">Name</span>
                            <input name="name" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{name}" required>
                            <span th:if="${#fields.hasErrors('name')}" class="text-xs font-semibold text-red-700" th:errors="*{name}"></span>
                        </label>
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.email}">Email Address</span>
                            <input name="email" type="email" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{email}" required>
                            <span th:if="${#fields.hasErrors('email')}" class="text-xs font-semibold text-red-700" th:errors="*{email}"></span>
                        </label>
                        <label th:if="${!isEdit}" class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.password}">Password</span>
                            <input name="password" type="password" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{password}" required>
                            <span th:if="${#fields.hasErrors('password')}" class="text-xs font-semibold text-red-700" th:errors="*{password}"></span>
                        </label>
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.phone}">Phone Number</span>
                            <input name="phone" type="tel" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{phone}" required>
                            <span th:if="${#fields.hasErrors('phone')}" class="text-xs font-semibold text-red-700" th:errors="*{phone}"></span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <a href="/admin/customers" class="px-5 py-2.5 text-sm font-bold text-[#956d50]" th:text="#{admin.customers.cancel}">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="${isEdit} ? #{admin.customers.save} : #{admin.customers.create}">Create customer</button>
                </div>
            </form>

            <div id="customer-addresses" th:if="${isEdit}" class="space-y-5">
                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30 flex items-center justify-between">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">location_on</span>
                            <span th:text="#{admin.customers.addresses.manage.title}">Manage Addresses</span>
                        </h4>
                    </div>

                    <form th:action="@{/admin/customers/{customerId}/addresses(customerId=${customerId})}" method="post" class="p-6 grid grid-cols-1 md:grid-cols-3 gap-4 border-b border-[#f3ece8]">
                        <h5 class="md:col-span-3 text-sm font-bold text-[#8b4513]" th:text="#{admin.customers.addresses.add.title}">Add address</h5>
                        <input name="firstName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.firstName}" th:value="${addressForm != null ? addressForm.firstName() : ''}" required>
                        <input name="lastName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.lastName}" th:value="${addressForm != null ? addressForm.lastName() : ''}" required>
                        <input name="companyName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.companyName}" th:value="${addressForm != null ? addressForm.companyName() : ''}">
                        <input name="address1" type="text" class="rounded-lg border-[#f3ece8] text-sm md:col-span-2" th:placeholder="#{admin.customers.addresses.address1}" th:value="${addressForm != null ? addressForm.address1() : ''}" required>
                        <input name="address2" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.address2}" th:value="${addressForm != null ? addressForm.address2() : ''}">
                        <input name="city" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.city}" th:value="${addressForm != null ? addressForm.city() : ''}" required>
                        <input name="state" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.state}" th:value="${addressForm != null ? addressForm.state() : ''}">
                        <input name="postcode" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.postcode}" th:value="${addressForm != null ? addressForm.postcode() : ''}">
                        <input name="country" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.country}" th:value="${addressForm != null ? addressForm.country() : ''}">
                        <input name="email" type="email" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.email}" th:value="${addressForm != null ? addressForm.email() : ''}">
                        <input name="phone" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.phone}" th:value="${addressForm != null ? addressForm.phone() : ''}">
                        <input name="vatId" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.vatId}" th:value="${addressForm != null ? addressForm.vatId() : ''}">
                        <input name="gender" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:placeholder="#{admin.customers.addresses.gender}" th:value="${addressForm != null ? addressForm.gender() : ''}">
                        <select name="addressType" class="rounded-lg border-[#f3ece8] text-sm">
                            <option th:each="type : ${addressTypes}" th:value="${type.name()}" th:text="${type.name()}" th:selected="${addressForm != null && addressForm.addressType() == type}">SHIPPING</option>
                        </select>
                        <label class="flex items-center gap-2 text-sm text-[#8b4513]">
                            <input name="defaultAddress" type="checkbox" class="rounded border-[#f3ece8]" th:checked="${addressForm != null && addressForm.defaultAddress()}">
                            <span th:text="#{admin.customers.addresses.defaultAddress}">Default address</span>
                        </label>
                        <div class="md:col-span-3 flex justify-end">
                            <button type="submit" class="px-4 py-2 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="#{admin.customers.addresses.add.submit}">Add address</button>
                        </div>
                    </form>

                    <div th:if="${#lists.isEmpty(customerAddresses)}" class="p-6 text-sm text-[#956d50]" th:text="#{admin.customers.addresses.empty}">
                        No addresses yet.
                    </div>

                    <div th:each="address : ${customerAddresses}" class="p-6 border-t border-[#f3ece8]">
                        <form th:action="@{/admin/customers/{customerId}/addresses/{addressId}(customerId=${customerId},addressId=${address.id})}" method="post" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="md:col-span-3 flex items-center justify-between">
                                <p class="text-sm font-bold text-[#8b4513]">
                                    <span th:text="#{admin.customers.addresses.version}">Version</span>
                                    <span th:text="${address.version}">1</span>
                                    <span th:if="${address.defaultAddress}" class="ml-2 text-xs px-2 py-0.5 rounded bg-green-100 text-green-700" th:text="#{admin.customers.address.default}">Default</span>
                                </p>
                            </div>

                            <input name="firstName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.firstName}" required>
                            <input name="lastName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.lastName}" required>
                            <input name="companyName" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.companyName}">
                            <input name="address1" type="text" class="rounded-lg border-[#f3ece8] text-sm md:col-span-2" th:value="${address.address1}" required>
                            <input name="address2" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.address2}">
                            <input name="city" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.city}" required>
                            <input name="state" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.state}">
                            <input name="postcode" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.postcode}">
                            <input name="country" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.country}">
                            <input name="email" type="email" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.email}">
                            <input name="phone" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.phone}">
                            <input name="vatId" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.vatId}">
                            <input name="gender" type="text" class="rounded-lg border-[#f3ece8] text-sm" th:value="${address.gender}">
                            <select name="addressType" class="rounded-lg border-[#f3ece8] text-sm">
                                <option th:each="type : ${addressTypes}" th:value="${type.name()}" th:text="${type.name()}" th:selected="${address.addressType == type}">SHIPPING</option>
                            </select>
                            <label class="flex items-center gap-2 text-sm text-[#8b4513]">
                                <input name="defaultAddress" type="checkbox" class="rounded border-[#f3ece8]" th:checked="${address.defaultAddress}">
                                <span th:text="#{admin.customers.addresses.defaultAddress}">Default address</span>
                            </label>

                            <div class="md:col-span-3 flex items-center justify-end gap-2">
                                <button type="submit" class="px-4 py-2 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="#{admin.customers.addresses.edit.submit}">Save address</button>
                                <button type="submit"
                                        formmethod="post"
                                        th:formaction="@{/admin/customers/{customerId}/addresses/{addressId}/delete(customerId=${customerId},addressId=${address.id})}"
                                        class="px-4 py-2 text-sm font-bold border border-red-200 text-red-700 rounded-lg hover:bg-red-50"
                                        th:text="#{admin.customers.addresses.delete}">
                                    Delete
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <script>
            (function () {
                var toggle = document.getElementById("customerActiveToggle");
                var statusText = document.getElementById("customerStatusText");
                if (!toggle || !statusText) {
                    return;
                }

                var activeText = statusText.getAttribute("data-active-text") || "Active";
                var inactiveText = statusText.getAttribute("data-inactive-text") || "Inactive";

                function syncStatus() {
                    statusText.textContent = toggle.checked ? activeText : inactiveText;
                }

                toggle.addEventListener("change", syncStatus);
                syncStatus();
            })();
        </script>
    </th:block>
</th:block>
</html>
