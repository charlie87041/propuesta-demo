<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{backoffice/layout :: layout(${pageTitle}, ~{::headerActions}, ~{::content})}">
    <th:block th:fragment="headerActions"></th:block>

    <th:block th:fragment="content">
        <section class="p-6 lg:p-8 max-w-5xl mx-auto w-full space-y-6">
            <nav class="text-sm text-[#956d50]">
                <a href="/admin/customers" class="hover:text-[#8b4513]" th:text="#{admin.customers.title}">Customer Management</a>
                <span class="mx-2">/</span>
                <span th:text="${isEdit} ? #{admin.customers.edit.title} : #{admin.customers.create}">Create customer</span>
            </nav>

            <div th:if="${errorMessage}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${errorMessage}"></div>

            <form th:action="${isEdit} ? @{/admin/customers/{customerId}(customerId=${customerId})} : @{/admin/customers}" th:object="${form}" method="post" enctype="multipart/form-data" class="space-y-6">
                <div class="bg-white rounded-xl border border-[#f3ece8] p-6 shadow-sm flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
                    <div class="flex items-center gap-5">
                        <div class="size-20 rounded-full border-4 border-[#f3ece8] bg-[#f8f7f6] flex items-center justify-center text-[#8b4513]/60">
                            <span class="material-symbols-outlined text-3xl">person</span>
                        </div>
                        <div class="space-y-2">
                            <p class="text-sm font-bold text-[#1b130e]" th:text="#{admin.customers.avatar}">Avatar</p>
                            <label class="inline-flex items-center gap-2 px-3 py-2 text-xs font-bold text-[#8b4513] border border-[#e6dad1] rounded-lg hover:bg-[#f8f7f6] cursor-pointer">
                                <span class="material-symbols-outlined text-base">upload</span>
                                <span th:text="#{admin.customers.avatar.upload}">Upload image</span>
                                <input type="file" name="avatar" accept="image/png,image/jpeg,image/webp" class="hidden">
                            </label>
                            <p class="text-xs text-[#8b4513]/60" th:text="#{admin.customers.avatar.help}">PNG/JPG/WEBP up to 5MB.</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-4 lg:min-w-[220px]">
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-[#8b4513]/60" th:text="#{admin.customers.status.label}">Account Status</p>
                            <p id="customerStatusText"
                               class="text-sm font-semibold text-[#8b4513]"
                               th:text="*{active} ? #{admin.customers.status.active} : #{admin.customers.status.inactive}"
                               th:attr="data-active-text=#{admin.customers.status.active},data-inactive-text=#{admin.customers.status.inactive}">Active</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input id="customerActiveToggle" class="sr-only peer" type="checkbox" th:field="*{active}"/>
                            <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#8b4513]"></div>
                        </label>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-[#f3ece8] shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-[#f3ece8] bg-[#f3ece8]/30">
                        <h4 class="font-bold text-[#8b4513] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">person</span>
                            <span th:text="#{admin.customers.section.personal}">Personal Information</span>
                        </h4>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.name}">Name</span>
                            <input name="name" type="text" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{name}" required>
                            <span th:if="${#fields.hasErrors('name')}" class="text-xs font-semibold text-red-700" th:errors="*{name}"></span>
                        </label>
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.email}">Email Address</span>
                            <input name="email" type="email" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{email}" required>
                            <span th:if="${#fields.hasErrors('email')}" class="text-xs font-semibold text-red-700" th:errors="*{email}"></span>
                        </label>
                        <label th:if="${!isEdit}" class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.password}">Password</span>
                            <input name="password" type="password" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{password}" required>
                            <span th:if="${#fields.hasErrors('password')}" class="text-xs font-semibold text-red-700" th:errors="*{password}"></span>
                        </label>
                        <label class="flex flex-col gap-1.5">
                            <span class="text-sm font-bold text-[#8b4513]/70" th:text="#{admin.customers.phone}">Phone Number</span>
                            <input name="phone" type="tel" class="rounded-lg border-[#f3ece8] focus:border-[#8b4513] focus:ring-[#8b4513]/20 text-sm" th:field="*{phone}" required>
                            <span th:if="${#fields.hasErrors('phone')}" class="text-xs font-semibold text-red-700" th:errors="*{phone}"></span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3">
                    <a href="/admin/customers" class="px-5 py-2.5 text-sm font-bold text-[#956d50]" th:text="#{admin.customers.cancel}">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 text-sm font-bold text-white bg-[#8b4513] rounded-lg" th:text="${isEdit} ? #{admin.customers.save} : #{admin.customers.create}">Create customer</button>
                </div>
            </form>
        </section>

        <script>
            (function () {
                var toggle = document.getElementById("customerActiveToggle");
                var statusText = document.getElementById("customerStatusText");
                if (!toggle || !statusText) {
                    return;
                }

                var activeText = statusText.getAttribute("data-active-text") || "Active";
                var inactiveText = statusText.getAttribute("data-inactive-text") || "Inactive";

                function syncStatus() {
                    statusText.textContent = toggle.checked ? activeText : inactiveText;
                }

                toggle.addEventListener("change", syncStatus);
                syncStatus();
            })();
        </script>
    </th:block>
</th:block>
</html>
