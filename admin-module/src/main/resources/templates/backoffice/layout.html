<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, headerActions, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Admin Backoffice</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: "Plus Jakarta Sans", sans-serif; }
    </style>
</head>
<body class="bg-[#f8f7f6] text-[#1b130e]">
<div class="flex min-h-screen">
    <aside class="hidden lg:flex w-72 flex-col border-r border-[#e6dad1] bg-white">
        <div class="p-6 border-b border-[#e6dad1]">
            <h1 class="font-extrabold text-lg text-[#8b4513]" th:text="#{admin.layout.brand}">CrumblyCookies</h1>
            <p class="text-xs text-[#956d50] font-semibold uppercase" th:text="#{admin.layout.subtitle}">Admin Backoffice</p>
        </div>
        <nav class="p-4 space-y-1">
            <a th:href="@{/admin/users}"
               class="block px-3 py-2 rounded-lg text-sm"
               th:classappend="${activeNav} == 'users' ? ' bg-[#8b4513]/10 text-[#8b4513] font-bold' : ' text-[#956d50] font-semibold hover:bg-[#8b4513]/10 hover:text-[#8b4513]'"
               th:text="#{admin.layout.nav.users}">Users</a>
            <a th:href="@{/admin/customers}"
               class="block px-3 py-2 rounded-lg text-sm"
               th:classappend="${activeNav} == 'customers' ? ' bg-[#8b4513]/10 text-[#8b4513] font-bold' : ' text-[#956d50] font-semibold hover:bg-[#8b4513]/10 hover:text-[#8b4513]'"
               th:text="#{admin.layout.nav.customers}">Customers</a>

            <div class="mt-4 block px-3 py-2 rounded-lg text-sm text-[#956d50] font-semibold"
                 th:text="#{admin.layout.nav.catalog}">Catalog</div>
            <div class="space-y-1 pl-2">
                <a th:href="@{/admin/categories}"
                   class="block px-3 py-1.5 rounded-lg text-[11px] uppercase tracking-wide"
                   th:classappend="${activeNav} == 'categories' ? ' text-[#8b4513] font-bold' : ' text-[#956d50]/80 font-bold hover:text-[#8b4513]'"
                   th:text="#{admin.layout.nav.categories}">Categories</a>
                <a th:href="@{/admin/product-sources}"
                   class="block px-3 py-1.5 rounded-lg text-[11px] uppercase tracking-wide"
                   th:classappend="${activeNav} == 'product-sources' ? ' text-[#8b4513] font-bold' : ' text-[#956d50]/80 font-bold hover:text-[#8b4513]'"
                   th:text="#{admin.layout.nav.product_sources}">Sources</a>
                <a th:href="@{/admin/products}"
                   class="block px-3 py-1.5 rounded-lg text-[11px] uppercase tracking-wide"
                   th:classappend="${activeNav} == 'products' ? ' text-[#8b4513] font-bold' : ' text-[#956d50]/80 font-bold hover:text-[#8b4513]'"
                   th:text="#{admin.layout.nav.products}">Products</a>
                <a th:href="@{/admin/catalog/stock}"
                   class="block px-3 py-1.5 rounded-lg text-[11px] uppercase tracking-wide"
                   th:classappend="${activeNav} == 'stock' ? ' text-[#8b4513] font-bold' : ' text-[#956d50]/80 font-bold hover:text-[#8b4513]'"
                   th:text="#{admin.layout.nav.stock}">Stock</a>
            </div>
        </nav>
    </aside>

    <main class="flex-1">
        <header class="h-16 px-6 lg:px-8 border-b border-[#e6dad1] bg-white flex items-center justify-between">
            <h2 class="font-extrabold text-xl" th:text="${pageTitle}">Admin Backoffice</h2>
            <div class="flex items-center gap-3">
                <a class="text-xs font-semibold text-[#956d50] hover:text-[#8b4513]" th:href="@{/admin/users(lang='es')}">ES</a>
                <span class="text-xs text-[#c3ad9d]">|</span>
                <a class="text-xs font-semibold text-[#956d50] hover:text-[#8b4513]" th:href="@{/admin/users(lang='en')}">EN</a>
                <div th:replace="${headerActions}"></div>
                
                <form action="/admin/logout" method="post">
                    <button type="submit" class="inline-flex items-center rounded-lg border border-[#e6dad1] px-3 py-2 text-sm font-semibold text-[#8b4513] hover:bg-[#8b4513]/10" th:text="#{admin.layout.logout}">
                        Logout
                    </button>
                </form>
            </div>
        </header>

        <div th:replace="${content}"></div>
    </main>
</div>
</body>
</html>
